      <stop offset="0%" stop-color="#FBF6EE"/>
      <stop offset="60%" stop-color="#F3E9D9"/>
      <stop offset="100%" stop-color="#E8D5C4"/>
    </radialGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1A2A"/>
