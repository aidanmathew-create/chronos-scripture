<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1A2A"/>
      <stop offset="50%" stop-color="#6B0F1A"/>
      <stop offset="100%" stop-color="#4A0A12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0B0"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F0D0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7736"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect x="0" y="0" width="512" height="512" fill="url(#crimsonGrad)"/>

  <!-- Syriac Cross centered with safe zone padding -->
  <g filter="url(#goldGlow)" transform="translate(0, 16)">
    <path d="M 256 140 L 276 160 L 276 372 L 236 372 L 236 160 Z" fill="url(#goldShine)" stroke="#B8860B" stroke-width="1.5"/>
    <path d="M 160 240 L 352 240 L 352 280 L 160 280 Z" fill="url(#goldShine)" stroke="#B8860B" stroke-width="1.5"/>
    <path d="M 236 160 L 256 120 L 276 160 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1"/>
    <path d="M 244 140 L 256 128 L 268 140 Z" fill="#F0E0B0"/>
    <path d="M 236 372 L 256 412 L 276 372 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1"/>
    <path d="M 244 392 L 256 404 L 268 392 Z" fill="#F0E0B0"/>
    <path d="M 160 240 L 120 260 L 160 280 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1"/>
    <path d="M 140 248 L 128 260 L 140 272 Z" fill="#F0E0B0"/>
    <path d="M 352 240 L 392 260 L 352 280 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1"/>
    <path d="M 372 248 L 384 260 L 372 272 Z" fill="#F0E0B0"/>
  </g>
  <circle cx="256" cy="256" r="22" fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="256" cy="256" r="5" fill="#F0E0B0"/>
</svg>
